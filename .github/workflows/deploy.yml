name: Deploy Client
# Railway handles the server (auto-deploys via its GitHub integration when
# this branch lands). This workflow only ships the client to GitHub Pages.
#
# This is the ONLY workflow allowed to publish to the github-pages
# environment. A second one (static.yml, the repo-scaffold default that
# uploaded `path: '.'`) used to trigger on the same branch: both ran on
# every push, both reported success, and whichever finished last decided
# whether the live site was the built client or a raw dump of the source
# tree. If another Pages workflow is ever added, fold it into this file
# instead - concurrent deploys to one environment have no defined winner.
on:
  push:
    branches:
      - main
      # Active dev branch - remove once main is the source of truth.
      - claude/add-claude-documentation-b6LkY
  workflow_dispatch:

concurrency:
  group: deploy-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        # Need full history so `git rev-list --count` works for the
        # build-version stamp below.
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Compute build version
        # Format: <commit-count>.<short-sha>, e.g. "347.8bc26f1". The
        # commit count gives a monotonic build number that ticks up
        # every push; the SHA makes any version traceable to source.
        run: echo "APP_VERSION=$(git rev-list --count HEAD).$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
      - name: Build client
        env:
          # Set this secret in repo settings to your Railway-provided
          # public WebSocket URL, e.g. wss://mydrunner-server.up.railway.app
          VITE_SERVER_URL: ${{ secrets.PUBLIC_SERVER_URL }}
          VITE_BASE: /${{ github.event.repository.name }}/
          APP_VERSION: ${{ env.APP_VERSION }}
        run: pnpm --filter @mydrunner/client run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # Named per attempt because artifacts persist across attempts
          # *within* a run: a plain re-run of a failed deploy leaves two
          # artifacts called `github-pages`, and deploy-pages refuses to
          # choose between them ("Multiple artifacts named ... count is 2").
          # That turned one slow deploy into a run that could not be retried
          # at all - every further re-run just added another artifact.
          name: github-pages-${{ github.run_attempt }}
          path: packages/client/dist
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          # Pages sat in `deployment_queued` for the full default 10 minutes
          # on 2026-08-06 and the action aborted a build that was ready in
          # 21 seconds. How long the queue takes is not ours to control; how
          # long we wait for it is.
          timeout: 1200000
