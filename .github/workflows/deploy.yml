name: Deploy Client
# Railway handles the server (auto-deploys via its GitHub integration when
# main moves). This workflow only ships the client to GitHub Pages.
#
# This is the ONLY workflow allowed to publish to the github-pages
# environment. A second one (static.yml, the repo-scaffold default that
# uploaded `path: '.'`) used to trigger on the same branch: both ran on
# every push, both reported success, and whichever finished last decided
# whether the live site was the built client or a raw dump of the source
# tree. If another Pages workflow is ever added, fold it into this file
# instead - concurrent deploys to one environment have no defined winner.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build and deploy are separate jobs on purpose. When deploy-pages runs in
  # the same job straight after upload-pages-artifact, its artifact lookup
  # can come back empty for an artifact finalised a few hundred ms earlier
  # ("No artifacts named ... were found", actions/deploy-pages#451). Both
  # attempts of the 2026-11-25 deploy failed that way. The job boundary puts
  # seconds between upload and lookup, as GitHub's own Pages starters do.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    outputs:
      # Named per attempt because artifacts persist across attempts
      # *within* a run: a plain re-run of a failed deploy leaves two
      # artifacts called `github-pages`, and deploy-pages refuses to
      # choose between them ("Multiple artifacts named ... count is 2").
      # Passed on as an output so "re-run failed jobs", which re-runs only
      # the deploy job, still looks for the attempt that was uploaded.
      artifact: ${{ steps.name.outputs.artifact }}
    steps:
      - id: name
        run: echo "artifact=github-pages-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        # Need full history so `git rev-list --count` works for the
        # build-version stamp below.
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Compute build version
        # Format: <commit-count>.<short-sha>, e.g. "347.8bc26f1". The
        # commit count gives a monotonic build number that ticks up
        # every push; the SHA makes any version traceable to source.
        run: echo "APP_VERSION=$(git rev-list --count HEAD).$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
      - name: Build client
        env:
          # Repo secret: the Railway server's public WebSocket URL,
          # wss://mydrunner-server-production.up.railway.app
          VITE_SERVER_URL: ${{ secrets.PUBLIC_SERVER_URL }}
          VITE_BASE: /${{ github.event.repository.name }}/
          APP_VERSION: ${{ env.APP_VERSION }}
        run: pnpm --filter @mydrunner/client run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: packages/client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact }}
          # Pages sat in `deployment_queued` for the full default 10 minutes
          # on 2026-08-06 and the action aborted a build that was ready in
          # 21 seconds. 10 minutes is also deploy-pages' ceiling: it clamps
          # anything larger (the 20 minutes this used to ask for) and warns.
          timeout: 600000
