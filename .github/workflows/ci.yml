name: CI
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      # Known-red tests are quarantined in the suites themselves (it.fails /
      # it.skip / test.fixme, each with the reason), not by switching CI off:
      # while the suites were gated behind RUN_TESTS, three unrelated
      # physics regressions landed unnoticed.
      - run: pnpm test
      # e2e stays behind RUN_TESTS until its editor specs are triaged.
      - run: pnpm --filter @mydrunner/e2e exec playwright install chromium
        if: ${{ vars.RUN_TESTS == 'true' }}
      - run: pnpm test:e2e
        if: ${{ vars.RUN_TESTS == 'true' }}
      - uses: actions/upload-artifact@v4
        if: ${{ failure() && vars.RUN_TESTS == 'true' }}
        with:
          name: playwright-results
          path: packages/e2e/test-results/
          if-no-files-found: ignore
