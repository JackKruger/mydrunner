<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mydrunner</title>
    <link rel="stylesheet" href="/src/player.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">connecting…</div>
    <div id="help" aria-label="Keyboard controls">
      <div class="help-row"><span><kbd>WASD / ARROWS</kbd></span><strong>DRIVE</strong></div>
      <div class="help-row"><span><kbd>SPACE / SHIFT</kbd></span><strong>HANDBRAKE / BRAKE</strong></div>
      <div class="help-row"><span><kbd>R / C / M / T</kbd></span><strong>RESET / CAM / MUTE / RADIO</strong></div>
    </div>

    <div id="touch-controls">
      <div id="steer-pad" role="slider" aria-label="Steering" aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0"><div id="steer-knob"></div></div>
      <button id="handbrake-btn" type="button" aria-pressed="false">hand<br/>brake</button>
      <div id="pedal-stack">
        <button class="pedal" id="throttle-btn" type="button" aria-pressed="false">gas</button>
        <button class="pedal" id="brake-btn" type="button" aria-pressed="false">brake</button>
      </div>
      <div id="aux-row">
        <button class="aux-btn" id="cam-btn" type="button" aria-label="Change camera">cam</button>
        <button class="aux-btn" id="reset-btn" type="button" aria-label="Reset vehicle">reset</button>
        <button class="aux-btn" id="starter-btn" type="button" aria-label="Crank the starter">start</button>
        <button class="aux-btn" id="mute-btn" type="button" aria-label="Toggle engine audio">mute</button>
        <button class="aux-btn" id="chat-btn" type="button" aria-label="Open team radio">chat</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
