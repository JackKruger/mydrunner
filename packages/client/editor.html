<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mydrunner — level editor</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%; height: 100%; overflow: hidden;
        background: #111; color: #eee;
        font-family: ui-monospace, monospace; font-size: 12px;
      }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; }

      #panel {
        position: fixed; top: 0; right: 0; bottom: 0; width: 260px;
        overflow-y: auto; padding: 10px;
        background: rgba(12, 14, 18, 0.92);
        border-left: 1px solid #2a3038;
      }
      .ed-section { margin-bottom: 12px; }
      .ed-title {
        font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
        color: #7d8a99; margin-bottom: 5px; font-weight: 600;
      }
      .ed-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
      .ed-row { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 5px; }
      button {
        font: inherit; padding: 4px 6px; cursor: pointer;
        background: #1b2028; color: #cdd6e0;
        border: 1px solid #2f3742; border-radius: 3px;
      }
      button:hover { background: #232a34; }
      button.active { background: #2d5c8a; border-color: #4a86c4; color: #fff; }
      button.ed-primary {
        flex: 1; background: #1f6b45; border-color: #2f9160; color: #eafff2;
        font-weight: 600;
      }
      button.ed-primary:hover { background: #268053; }
      .ed-field {
        display: grid; grid-template-columns: 62px 1fr auto;
        align-items: center; gap: 6px; margin-bottom: 4px;
      }
      .ed-label { color: #8b98a7; }
      .ed-value { color: #cdd6e0; min-width: 34px; text-align: right; }
      input[type="range"] { width: 100%; }
      input[type="text"], input[type="number"], select {
        font: inherit; width: 100%; padding: 3px 5px;
        background: #14181e; color: #cdd6e0;
        border: 1px solid #2f3742; border-radius: 3px;
      }
      input[type="checkbox"] { justify-self: start; }
      .ed-status {
        margin-top: 10px; padding: 6px; min-height: 34px;
        background: #14181e; border-radius: 3px;
        color: #93a3b3; line-height: 1.4; word-break: break-word;
      }
      .ed-status.error { color: #ff9a8a; }
      .ed-caption { color: #6f7d8c; font-size: 10px; margin-top: 2px; }
      optgroup { color: #7d8a99; font-style: normal; }
      optgroup option { color: #cdd6e0; }

      #help {
        position: fixed; bottom: 8px; left: 8px; padding: 6px 10px;
        background: rgba(0, 0, 0, 0.55); border-radius: 4px;
        font-size: 11px; line-height: 1.5; color: #b9c4cf;
        pointer-events: none; opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="panel"></div>
    <div id="help">
      WASD/QE = fly (shift fast, ctrl slow) · right-drag = look<br />
      left-drag = use tool · 0-9 = pick tool · [ ] = aim · Z/Y = undo/redo · Ctrl+S = save
    </div>
    <script type="module" src="/src/editor/main.ts"></script>
  </body>
</html>
